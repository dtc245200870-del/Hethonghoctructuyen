name: elearning

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: elearning
      DB_USER: elearning
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_DIR: /var/log/elearning
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-logs:/var/log/elearning
    networks:
      - app-net
      - data-net
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elearning
      MYSQL_USER: elearning
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data-net
      - admin-net

  nginx-log-init:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown 101:101 /logs && chmod 0750 /logs"]
    volumes:
      - nginx-file-logs:/logs

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-file-logs:/var/log/elearning-nginx
    depends_on:
      app:
        condition: service_healthy
      nginx-log-init:
        condition: service_completed_successfully
    networks:
      - edge-net
      - app-net
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
      - /var/cache/nginx:size=16M
      - /var/run:size=1M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-net
      - data-net
      - observability-net
      - admin-net
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
      - mysql-exporter
      - nginx-exporter

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability-net
      - admin-net
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki

  mysql-exporter-init:
    image: mysql:8.4
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mysqladmin ping -h db -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent; do sleep 2; done
        mysql -h db -uroot -p"$$MYSQL_ROOT_PASSWORD" <<SQL
        CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '$$MYSQL_EXPORTER_PASSWORD';
        ALTER USER 'exporter'@'%' IDENTIFIED BY '$$MYSQL_EXPORTER_PASSWORD';
        GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
        SQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    networks:
      - data-net
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - umask 077; printf '[client]\nuser=%s\npassword=%s\nhost=%s\n' "$$MYSQLD_EXPORTER_USER" "$$MYSQLD_EXPORTER_PASSWORD" "$$MYSQLD_EXPORTER_HOST" > /tmp/.my.cnf; exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
    environment:
      MYSQLD_EXPORTER_USER: exporter
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
      MYSQLD_EXPORTER_HOST: db
    networks:
      - data-net
    depends_on:
      mysql-exporter-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://proxy:8080/nginx_status
    networks:
      - app-net
    depends_on:
      - proxy
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - observability-net
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/app:ro
      - nginx-file-logs:/var/log/nginx:ro
      - promtail-positions:/tmp
    networks:
      - app-net
      - observability-net
    depends_on:
      app:
        condition: service_healthy
      proxy:
        condition: service_healthy
      loki:
        condition: service_started
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
  app-logs:
  nginx-file-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  edge-net:
  admin-net:
  app-net:
    internal: true
  data-net:
    internal: true
  observability-net:
    internal: true
